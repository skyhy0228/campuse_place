name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 단위 테스트와 브라우저 테스트(Chrome)를 통과해야 배포된다.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      # 빌드하면서 data/recommendations_normalized.xlsx → public/data/places.json 을 다시 생성한다.
      # 테스트용 빌드는 가짜 지도 키(.env.e2e)를 쓰고, 테스트가 네이버 지도 스크립트를 가짜로 바꿔 끼운다.
      - run: npm run build:e2e
      - run: npm run test:e2e

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # 저장소 Settings → Secrets and variables → Actions → Variables 에 등록한다.
          # 네이버 지도 Client ID 는 등록한 사이트 주소에서만 동작하는 공개용 값이며, 없으면 지도 기능이 숨겨진다.
          VITE_NAVER_MAP_CLIENT_ID: ${{ vars.VITE_NAVER_MAP_CLIENT_ID }}
          # Supabase Project URL 과 publishable 키(공개용). 없으면 회원·후기·제보는 Supabase 없이 동작한다.
          # secret / service_role 키는 여기에 넣지 않는다. 데이터 보호는 supabase/schema.sql 의 RLS 가 한다.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
