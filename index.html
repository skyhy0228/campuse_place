<html lang="ko">

    <!-- 저장된 화면 테마를 첫 화면이 그려지기 전에 적용해 깜빡임을 막는다 -->
    <script>
      try {
        var t = localStorage.getItem("campuse:theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
